[package]
name = "reprotrace"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Explain observed Cargo rebuild and compiler-cache differences"
license = "MIT"
repository = "https://github.com/joshiii-xyz/reprotrace"
keywords = ["cargo", "build", "cache", "reproducibility", "diagnostics"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.13"
