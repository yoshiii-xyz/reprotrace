name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust components
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable check --all-targets --locked
      - run: cargo +stable clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo +stable test --all-targets --locked
      - run: RUSTDOCFLAGS=-Dwarnings cargo +stable doc --no-deps --locked
      - run: cargo +stable package --locked
      - name: Install cargo-audit
        run: cargo +stable install --locked cargo-audit@0.22.2
      - run: cargo audit
